<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Player</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --panel-hover:#1f232c; --text:#e8eaf0; --muted:#9aa3b2;
    --accent:#3fb37f; --line:#2a2f3a; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:9vh 16px 40px; text-align:center; }
  h1 { margin:0 0 8px; font-size:32px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 36px; line-height:1.5; }
  .choices { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  @media (max-width:720px) { .choices { grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:440px) { .choices { grid-template-columns:1fr; } }
  a.card { position:relative; display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:28px 16px 22px; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    color:var(--text); text-decoration:none; transition:background .15s, border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { background:var(--panel-hover); border-color:var(--accent);
    transform:translateY(-2px); outline:none; }
  .badge { width:72px; height:72px; border-radius:18px; border:3px solid var(--accent);
    display:grid; place-items:center; font-weight:800; font-size:20px; color:var(--accent);
    letter-spacing:.02em; margin-bottom:6px; }
  .card b { font-size:20px; }
  .card span { color:var(--muted); font-size:13px; }
  .card kbd { position:absolute; top:10px; right:12px; font:inherit; font-size:11px; color:var(--muted);
    border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  footer { color:var(--muted); font-size:12px; margin-top:36px; line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>Retro Player</h1>
  <p class="sub">Choose a system. You'll load a game you own, and it stays in your browser.</p>
  <div class="choices" id="choices"></div>
  <footer>In game: P = pause menu · F1 = 5x fast forward<br>No games are included. Use your own legally obtained ROMs.</footer>
</main>
<script>
  const SYSTEMS = [
    { page: 'nes.html', short: 'NES', name: 'NES',             full: 'Nintendo Entertainment System' },
    { page: 'gbc.html', short: 'GBC', name: 'Game Boy Color',  full: 'Also plays Game Boy games' },
    { page: 'gba.html', short: 'GBA', name: 'Game Boy Advance', full: 'Handheld, 2001' },
    { page: 'n64.html', short: 'N64', name: 'Nintendo 64',     full: 'Home console, 1996' },
    { page: 'ds.html',  short: 'DS',  name: 'Nintendo DS',     full: 'Dual-screen handheld' },
    { page: 'ps1.html', short: 'PS1', name: 'PlayStation',     full: 'Home console, 1994' },
    { page: 'psp.html', short: 'PSP', name: 'PSP',             full: 'Handheld, 2004 · needs a fast PC' },
  ];
  const grid = document.getElementById('choices');
  SYSTEMS.forEach((s, i) => {
    grid.insertAdjacentHTML('beforeend', `
      <a class="card" href="${s.page}">
        <kbd>${i + 1}</kbd>
        <div class="badge">${s.short}</div>
        <b>${s.name}</b>
        <span>${s.full}</span>
      </a>`);
  });
  window.addEventListener('keydown', e => {
    const s = SYSTEMS[Number(e.key) - 1];
    if (s) location.href = s.page;
  });
</script>
</body>
</html>
